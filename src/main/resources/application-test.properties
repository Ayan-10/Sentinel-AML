# Integration-test profile: in-memory H2 in PostgreSQL compatibility mode.
spring.datasource.url=jdbc:h2:mem:sentinel_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
sentinel.seed.enabled=false
