# ===========================================================================
# Sentinel AML - base configuration
#
# NFR (Security): no secret is hardcoded here. Every credential is an
# ${ENV_VAR:dev-default} placeholder; real values are injected by the
# container runtime from an uncommitted .env file. See .env.example.
#
# Detection thresholds are NOT in this file by design - they live in the
# rule_config table so compliance can retune them without a redeployment.
# ===========================================================================
spring.application.name=sentinel-aml
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# --- Persistence -----------------------------------------------------------
# ddl-auto=validate: Flyway owns the schema. Hibernate may only verify that
# the mapped entities match the migrated tables, never alter them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Migrations ------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# --- Web -------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB
spring.mvc.problemdetails.enabled=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# --- OpenAPI / Swagger (deliverable D4) ------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# --- Actuator --------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# --- Sentinel domain settings ----------------------------------------------
# Business rule 9: base currency for cross-transaction normalisation.
sentinel.base-currency=INR
# NFR (Performance): bulk detection is chunked and evaluated in parallel.
sentinel.detection.worker-threads=${SENTINEL_WORKER_THREADS:8}
sentinel.detection.bulk-chunk-size=${SENTINEL_BULK_CHUNK_SIZE:2000}
sentinel.detection.queue-capacity=500
# Seed synthetic data on first startup so a cold boot is demo-ready.
sentinel.seed.enabled=${SENTINEL_SEED_ENABLED:true}
sentinel.seed.customers=500
sentinel.seed.transactions=10000
# Demo credentials - overridden by environment in any real deployment.
sentinel.security.analyst-password=${SENTINEL_ANALYST_PASSWORD:analyst123}
sentinel.security.senior-password=${SENTINEL_SENIOR_PASSWORD:senior123}
sentinel.security.admin-password=${SENTINEL_ADMIN_PASSWORD:admin123}
sentinel.security.cors-allowed-origins=${SENTINEL_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Logging (NFR: meaningful SLF4J logging) -------------------------------
logging.level.root=INFO
logging.level.com.meridiantrust.sentinel=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n
