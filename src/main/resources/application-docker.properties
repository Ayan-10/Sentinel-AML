# Container profile. Host is the Compose service name, not localhost.
spring.datasource.url=jdbc:postgresql://${DB_HOST:sentinel-db}:5432/${POSTGRES_DB:sentinel}
spring.datasource.username=${POSTGRES_USER:sentinel}
spring.datasource.password=${POSTGRES_PASSWORD:sentinel}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.pool-name=sentinel-cp
spring.datasource.hikari.connection-timeout=30000
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
