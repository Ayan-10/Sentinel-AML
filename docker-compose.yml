# ===========================================================================
# Sentinel AML - full stack. `docker compose up --build` brings up the
# database, the API (migrated + seeded) and the analyst UI. No manual step.
# ===========================================================================
services:

  sentinel-db:
    image: postgres:16-alpine
    container_name: sentinel-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API waits on THIS, not merely on the container existing - the
      # difference between a reliable start and a race.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks: [sentinel-net]

  sentinel-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-api
    depends_on:
      sentinel-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: sentinel-db
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      SENTINEL_ANALYST_PASSWORD: ${SENTINEL_ANALYST_PASSWORD:-analyst123}
      SENTINEL_SENIOR_PASSWORD: ${SENTINEL_SENIOR_PASSWORD:-senior123}
      SENTINEL_ADMIN_PASSWORD: ${SENTINEL_ADMIN_PASSWORD:-admin123}
      SENTINEL_WORKER_THREADS: ${SENTINEL_WORKER_THREADS:-8}
      SENTINEL_SEED_ENABLED: ${SENTINEL_SEED_ENABLED:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    networks: [sentinel-net]
    restart: on-failure


  sentinel-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-web
    depends_on:
      sentinel-api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"
    networks: [sentinel-net]
    restart: on-failure

networks:
  sentinel-net:
    driver: bridge

volumes:
  sentinel_pgdata:
